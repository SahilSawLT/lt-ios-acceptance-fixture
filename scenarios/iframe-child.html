<!doctype html>
<html><head><title>Iframe Child</title></head>
<body>
  <h2>Sign in</h2>
  <form>
    <label for="iframe-email">Email</label>
    <input id="iframe-email" type="email" data-iframe-tag="email-input">

    <label for="iframe-password">Password</label>
    <input id="iframe-password" type="password" data-iframe-tag="password-input">

    <button type="submit" data-iframe-tag="signin-button">Sign in</button>
  </form>
</body></html>
